<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 205" fill="none">
  <defs>
    <linearGradient id="cg" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#07c8f9"/>
      <stop offset="100%" stop-color="#4a8fe8"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#9b8cfc"/>
      <stop offset="100%" stop-color="#5c5ee8"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#3a44b0"/>
      <stop offset="100%" stop-color="#2b3488"/>
    </linearGradient>
  </defs>

  <!-- Bottom card (navy + code symbol) -->
  <g transform="translate(98,155) rotate(-14)">
    <rect x="-75" y="-24" width="150" height="48" rx="10" fill="url(#ng)"/>
    <text x="0" y="9"
          font-family="'Courier New',monospace"
          font-size="20" font-weight="800"
          fill="white" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Shadow between middle and bottom -->
  <polygon points="25,140 21,151 25,151" fill="#1a2468" opacity="0.85"/>

  <!-- Middle card (purple) -->
  <g transform="translate(93,97) rotate(-14)">
    <rect x="-75" y="-24" width="150" height="48" rx="10" fill="url(#pg)"/>
  </g>

  <!-- Shadow between top and middle -->
  <polygon points="20,84 15,95 20,95" fill="#3b34a8" opacity="0.85"/>

  <!-- Top card (cyan) -->
  <g transform="translate(88,45) rotate(-14)">
    <rect x="-75" y="-24" width="150" height="48" rx="10" fill="url(#cg)"/>
  </g>
</svg>
