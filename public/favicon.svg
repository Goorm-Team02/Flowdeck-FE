<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g1" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Three staggered bars: deck(층) + flow(방향성) -->
  <rect x="2"  y="5"  width="20" height="6" rx="3" fill="url(#g1)"/>
  <rect x="8"  y="13" width="20" height="6" rx="3" fill="url(#g2)"/>
  <rect x="14" y="21" width="16" height="6" rx="3" fill="url(#g3)"/>
</svg>
