name: frontend-prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy frontend through SSM
        run: |
          SSM_COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flowdeck frontend prod" \
            --parameters 'commands=[
              "set -e",
              "git config --system --add safe.directory /opt/flowdeck/frontend-prod/app",
              "cd /opt/flowdeck/frontend-prod/app",
              "git fetch origin main",
              "git reset --hard origin/main",
              "if [ -s /home/ec2-user/.nvm/nvm.sh ]; then . /home/ec2-user/.nvm/nvm.sh; fi",
              "if ! command -v npm >/dev/null 2>&1; then echo npm not found in PATH; find /home/ec2-user /usr/local /opt -path '*/bin/npm' -type f 2>/dev/null; exit 127; fi",
              "node --version",
              "npm --version",
              "npm install",
              "npm run build",
              "test -f dist/index.html",
              "ls -la dist",
              "sudo nginx -t",
              "sudo systemctl reload nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command id: ${SSM_COMMAND_ID}"

          for attempt in {1..120}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${SSM_COMMAND_ID}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || true)"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "${SSM_COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status: Status, Stdout: StandardOutputContent, Stderr: StandardErrorContent}" \
            --output json

          test "${STATUS}" = "Success"
